<!doctype html><meta charset="utf-8"><title>道家Q版特效复核</title><style>body{background:#eae0c8;color:#174437;font:17px sans-serif;margin:24px}.pair{display:flex;gap:16px}.stage{width:768px;height:300px;background:#fff3da;display:flex}.dark{background:#123b33}.stage img{width:256px;height:256px;object-fit:contain}button,select{font:inherit;padding:8px}</style><h1>爆裂、流火与引力井 · 美术播放复核</h1><p>爆裂原动作是一次播放；审片页自动重复以检查各阶段。引力井为静态作用区图片。只播放美术，不模拟战斗行为。</p><button id="toggle">暂停</button><button id="step">下一帧</button><label>速度<select id="speed"><option value="1">正常</option><option value="0.5">半速</option></select></label><p id="info">载图</p><div class="stage"><img id="el"><img id="fl"><img src="../assets/effects/fx_gravity_well.png"></div><div class="stage dark"><img id="ed"><img id="fd"><img src="../assets/effects/fx_gravity_well.png"></div><script>let running=true,speed=1,manual=0,start=performance.now(),last='',changes=0;const jobs=[],clips=['fx_explosion','fx_firefield'].map(name=>Array.from({length:6},(_,i)=>{const im=new Image;jobs.push(new Promise((yes,no)=>{im.onload=yes;im.onerror=no}));im.src='../assets/final/combat/effects/'+name+'/'+name+'_'+String(i).padStart(2,'0')+'.png';return im}));document.querySelector('#toggle').onclick=()=>{running=!running};document.querySelector('#step').onclick=()=>{running=false;manual=(manual+1)%6};document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);start=performance.now()};Promise.all(jobs).then(()=>requestAnimationFrame(draw));function draw(){const t=(performance.now()-start)*speed,e=running?(function(){let q=t%900;for(let i=0;i<6;i++){q-=[60,70,90,100,110,100][i];if(q<0)return i}return 5})():manual,f=running?Math.floor((t%660)/110):manual,key=e+','+f;if(key!==last){changes++;last=key;document.querySelector('#el').src=document.querySelector('#ed').src=clips[0][e].src;document.querySelector('#fl').src=document.querySelector('#fd').src=clips[1][f].src}document.querySelector('#info').textContent='12张动态帧已载入 · 爆裂'+(e+1)+'/6 · 流火'+(f+1)+'/6 · 实际切帧'+changes+'次';requestAnimationFrame(draw)}</script>
