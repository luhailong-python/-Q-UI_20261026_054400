<!doctype html><meta charset="utf-8"><title>道家Q版素材叠加审阅</title><style>body{margin:20px;background:#eae0c8;color:#174437;font:17px sans-serif}h1{font-size:26px}button,select{font:inherit;padding:8px;margin:4px}.board{width:1152px;height:760px;position:relative;overflow:hidden;background:url(../assets/environment/env_battle_ground_01.png);background-size:626px 626px;animation:pan 16s linear infinite}.actor{position:absolute;width:260px;height:260px}.actor img{width:100%;height:100%}.label{position:absolute;bottom:-4px;left:20%;background:#fff3da;padding:2px 5px;border-radius:4px;font-size:14px}.object{position:absolute;width:55px;height:55px}.small{max-width:1152px;line-height:1.5}.portrait{width:760px;height:1152px}@keyframes pan{to{background-position:626px 626px}}</style><h1>道家Q版 · 素材叠加与循环审阅</h1><p class="small">只核对已交付图片的比例、透明边缘、重复地面与动作帧。全部身份同屏仅用于审片；无操控、碰撞、战斗或业务逻辑，不是游戏UI实现。</p><button id="toggle">暂停素材播放</button><label>速度<select id="speed"><option value="1">正常 1×</option><option value="0.5">慢速 0.5×</option></select></label><button id="orientation">查看竖向画幅</button><p id="state">读取实际图片</p><div class="board" id="board"></div><p>上方一排：敌弹与投射物；下方一排：4档经验与5档钱币。地面为同一张原生1254²图片的626px审片重复，不做放大或接缝修补。</p><script>
const actors=[{"actor": "hero_daotong", "name": "青云道童", "frames": ["assets/motion/hero_daotong/walk/hero_daotong_walk_00.png", "assets/motion/hero_daotong/walk/hero_daotong_walk_01.png", "assets/motion/hero_daotong/walk/hero_daotong_walk_02.png", "assets/motion/hero_daotong/walk/hero_daotong_walk_03.png"], "tick": 100, "px": 205}, {"actor": "hero_lingyi", "name": "清荷灵医", "frames": ["assets/motion/hero_lingyi/walk/hero_lingyi_walk_00.png", "assets/motion/hero_lingyi/walk/hero_lingyi_walk_01.png", "assets/motion/hero_lingyi/walk/hero_lingyi_walk_02.png", "assets/motion/hero_lingyi/walk/hero_lingyi_walk_03.png"], "tick": 100, "px": 205}, {"actor": "hero_leixiu", "name": "玄霆道人", "frames": ["assets/motion/hero_leixiu/walk/hero_leixiu_walk_00.png", "assets/motion/hero_leixiu/walk/hero_leixiu_walk_01.png", "assets/motion/hero_leixiu/walk/hero_leixiu_walk_02.png", "assets/motion/hero_leixiu/walk/hero_leixiu_walk_03.png"], "tick": 100, "px": 205}, {"actor": "orig_mob01", "name": "青符灵", "frames": ["assets/motion/orig_mob01/walk/orig_mob01_walk_00.png", "assets/motion/orig_mob01/walk/orig_mob01_walk_01.png", "assets/motion/orig_mob01/walk/orig_mob01_walk_02.png", "assets/motion/orig_mob01/walk/orig_mob01_walk_03.png"], "tick": 200, "px": 170}, {"actor": "orig_mob02", "name": "苔玉小魁", "frames": ["assets/motion/orig_mob02/walk/orig_mob02_walk_00.png", "assets/motion/orig_mob02/walk/orig_mob02_walk_01.png", "assets/motion/orig_mob02/walk/orig_mob02_walk_02.png", "assets/motion/orig_mob02/walk/orig_mob02_walk_03.png"], "tick": 200, "px": 170}, {"actor": "orig_mob03", "name": "灯芯小魅", "frames": ["assets/motion/orig_mob03/walk/orig_mob03_walk_00.png", "assets/motion/orig_mob03/walk/orig_mob03_walk_01.png", "assets/motion/orig_mob03/walk/orig_mob03_walk_02.png", "assets/motion/orig_mob03/walk/orig_mob03_walk_03.png"], "tick": 150, "px": 170}, {"actor": "orig_mob04", "name": "竹甲小妖", "frames": ["assets/motion/orig_mob04/walk/orig_mob04_walk_00.png", "assets/motion/orig_mob04/walk/orig_mob04_walk_01.png", "assets/motion/orig_mob04/walk/orig_mob04_walk_02.png", "assets/motion/orig_mob04/walk/orig_mob04_walk_03.png"], "tick": 150, "px": 170}, {"actor": "orig_mob05", "name": "桃木小傀", "frames": ["assets/motion/orig_mob05/walk/orig_mob05_walk_00.png", "assets/motion/orig_mob05/walk/orig_mob05_walk_01.png", "assets/motion/orig_mob05/walk/orig_mob05_walk_02.png", "assets/motion/orig_mob05/walk/orig_mob05_walk_03.png"], "tick": 200, "px": 170}, {"actor": "orig_mob06", "name": "玄甲山魈", "frames": ["assets/motion/orig_mob06/walk/orig_mob06_walk_00.png", "assets/motion/orig_mob06/walk/orig_mob06_walk_01.png", "assets/motion/orig_mob06/walk/orig_mob06_walk_02.png", "assets/motion/orig_mob06/walk/orig_mob06_walk_03.png"], "tick": 200, "px": 170}, {"actor": "orig_boss_minor", "name": "铜铃卫", "frames": ["assets/motion/orig_boss_minor/walk/orig_boss_minor_walk_00.png", "assets/motion/orig_boss_minor/walk/orig_boss_minor_walk_01.png", "assets/motion/orig_boss_minor/walk/orig_boss_minor_walk_02.png", "assets/motion/orig_boss_minor/walk/orig_boss_minor_walk_03.png"], "tick": 200, "px": 270}, {"actor": "orig_boss01", "name": "玄坛石尊", "frames": ["assets/motion/orig_boss01/walk/orig_boss01_walk_00.png", "assets/motion/orig_boss01/walk/orig_boss01_walk_01.png", "assets/motion/orig_boss01/walk/orig_boss01_walk_02.png", "assets/motion/orig_boss01/walk/orig_boss01_walk_03.png"], "tick": 200, "px": 270}],objects=["assets/final/combat/projectiles/proj_wind_blade.png", "assets/final/combat/projectiles/proj_jade_bolt.png", "assets/final/combat/projectiles/enemy_paper_dart.png", "assets/final/combat/projectiles/enemy_return_disc.png", "assets/final/combat/projectiles/enemy_lob_orb_pending.png", "assets/final/combat/pickups/xp_white_1.png", "assets/final/combat/pickups/xp_blue_2.png", "assets/final/combat/pickups/xp_green_10.png", "assets/final/combat/pickups/xp_red_50.png", "assets/final/combat/pickups/money_bronze_1.png", "assets/final/combat/pickups/money_silver_2.png", "assets/final/combat/pickups/money_gold_5.png", "assets/final/combat/pickups/money_pouch_30.png", "assets/final/combat/pickups/money_bag_50.png"],board=document.querySelector('#board');let running=true,speed=1,portrait=false,start=performance.now(),loaded=0;const layers=[];let changes=0,last='';const jobs=[];
function load(src){const im=new Image;jobs.push(new Promise((yes,no)=>{im.onload=()=>{loaded++;yes()};im.onerror=()=>no(new Error(src))}));im.src='../'+src;return im}
for(let i=0;i<actors.length;i++){const a=actors[i],div=document.createElement('div');div.className='actor';div.style.width=div.style.height=a.px+'px';const im=document.createElement('img'),label=document.createElement('span');label.className='label';label.textContent=a.name;div.append(im,label);board.append(div);layers.push({div,im,cache:a.frames.map(load),actor:a});}
const props=objects.map((src,i)=>{const im=load(src);im.className='object';board.append(im);return im});
function layout(){const w=portrait?760:1152,h=portrait?1152:760;layers.forEach((l,i)=>{const cols=portrait?3:6,row=Math.floor(i/cols),col=i%cols;const x=(col+.5)*w/cols,y=portrait?235+row*220:240+row*280;l.div.style.left=x-l.actor.px/2+'px';l.div.style.top=y-l.actor.px*.87+'px';});props.forEach((im,i)=>{im.style.left=(i<5?(i+.5)*(w/5)-27:(i-5+.5)*(w/9)-27)+'px';im.style.top=(i<5?25:h-85)+'px';});}
document.querySelector('#toggle').onclick=()=>{running=!running;board.style.animationPlayState=running?'running':'paused';document.querySelector('#toggle').textContent=running?'暂停素材播放':'继续素材播放';};document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);board.style.animationDuration=(16/speed)+'s';start=performance.now();};document.querySelector('#orientation').onclick=()=>{portrait=!portrait;board.classList.toggle('portrait',portrait);layout();};layout();
Promise.all(jobs).then(()=>{document.body.dataset.ready='true';requestAnimationFrame(draw)}).catch(e=>document.querySelector('#state').textContent='缺图 '+e.message);
function draw(){const t=(performance.now()-start)*speed;if(running){const phases=[];layers.forEach(l=>{const f=Math.floor(t/l.actor.tick)%4;l.im.src=l.cache[f].src;phases.push(f)});const key=phases.join(',');if(key!==last){changes++;last=key;}document.querySelector('#state').textContent=actors.length+'个身份，'+loaded+'张图片已载入 · 实际帧变更 '+changes+' 次 · 当前姿势 '+phases.map(f=>f+1).join('/');}requestAnimationFrame(draw);}
</script>
